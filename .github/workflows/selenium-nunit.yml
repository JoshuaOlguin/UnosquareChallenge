name: Selenium NUnit Tests

on:
  push:
    paths:
      - '**/*.cs'
      - '**/*.sln'
      - '.github/workflows/**'
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v1

      - name: Restore NuGet packages
        run: nuget restore AutomatedScript.sln

      - name: Setup MSBuild tools
        uses: microsoft/setup-msbuild@v1

      - name: Build solution (Release)
        run: msbuild AutomatedScript.sln /p:Configuration=Release /m

      - name: Install Microsoft.TestPlatform (vstest.console.exe) via NuGet
        run: nuget install Microsoft.TestPlatform -OutputDirectory testrunner

      - name: Run tests with vstest.console.exe
        shell: powershell
        run: |
          Write-Host "Locating vstest.console.exe..."
          $vstest = Get-ChildItem -Path testrunner -Filter vstest.console.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

          if (-not $vstest) {
            Write-Host "vstest.console.exe not found in testrunner; searching common Visual Studio locations..."
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.TestTools.Build -property installationPath
              $candidatePaths = @()
              if ($vsPath) { $candidatePaths += $vsPath }
              $candidatePaths += Get-ChildItem 'C:\Program Files (x86)\Microsoft Visual Studio' -Directory | ForEach-Object { $_.FullName }
              foreach ($p in $candidatePaths) {
                $possible = Join-Path $p "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
                if (Test-Path $possible) { $vstest = $possible; break }
                $possible2 = Join-Path $p "Common7\IDE\Extensions\TestPlatform\vstest.console.exe"
                if (Test-Path $possible2) { $vstest = $possible2; break }
              }
            }
          }

          if (-not $vstest) {
            Write-Error "vstest.console.exe not found on runner."
            exit 1
          }

          Write-Host "vstest found at: $vstest"

          # Prefer Release build artifact, fall back to Debug
          $testDll = "AutomatedScript\bin\Release\AutomatedScript.dll"
          if (-not (Test-Path $testDll)) {
            $testDll = "AutomatedScript\bin\Debug\AutomatedScript.dll"
            if (-not (Test-Path $testDll)) {
              Write-Error "Test assembly not found in expected output paths."
              exit 1
            }
          }

          $resultsDir = "TestResults"
          New-Item -ItemType Directory -Path $resultsDir -Force | Out-Null
          $trx = Join-Path $resultsDir "results.trx"

          & $vstest $testDll /EnableConsoleLogger /Logger:trx;LogFileName=$trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
