name: Run Amazon Test Cases

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v1
      with:
        vs-version: latest

    - name: Restore NuGet packages
      run: nuget restore AutomatedScript.sln

    - name: Build solution
      run: msbuild AutomatedScript.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Run NUnit tests
      run: |
        dotnet tool install --global NUnit.ConsoleRunner
        nunit3-console Tests\bin\Release\AutomatedScript.Tests.dll --where "class == AutomatedScript.Tests.AmazonTestCases" --result=TestResults.xml

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: TestResults.xml
        check_name: Amazon Test Cases Results
