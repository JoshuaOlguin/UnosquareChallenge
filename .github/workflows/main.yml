name: Run NUnit and Selemium Tests

on:
  push:
    branches: [ Master, main ]
  pull_request:
    branches: [ Master, main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Restore NuGet Packages
      run: nuget restore AutomatedScript.sln

    - name: Build Solution
      run: msbuild AutomatedScript.sln /p:Configuration=Release

    - name: Install NUnit Console
      run: nuget install NUnit.ConsoleRunner -OutputDirectory packages

    - name: Run NUnit Tests
      run: ./packages/NUnit.ConsoleRunner.*/tools/nunit3-console.exe "bin/Release/AutomatedScript.Tests.dll" --result=TestResults.xml

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: nunit-results
        path: TestResults.xml
