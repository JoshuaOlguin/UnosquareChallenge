name: Run NUnit and Selenium Tests and Test Result Visualization

on:
  push:
    branches: [ Master, main ]
  pull_request:
    branches: [ Master, main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install Chrome
      run: choco install googlechrome --ignore-checksums -y

    - name: Install ChromeDriver
      run: choco install chromedriver --ignore-checksums -y

    - name: Restore NuGet Packages
      run: dotnet restore AutomatedScript.sln

    - name: Build Solution
      run: dotnet build AutomatedScript.sln --configuration Release --no-restore

    - name: Run NUnit and Selenium Tests
      continue-on-error: true   # allows workflow to continue even if tests fail
      env:
        CI: true
      run: dotnet test AutomatedScript.sln --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx;OutputDirectory=TestResults"

    - name: List screenshot files
      if: always()
      run: |
        if (Test-Path "${{ github.workspace }}\TestResults\Screenshots") {
          dir "${{ github.workspace }}\TestResults\Screenshots"
        } else {
          echo "No screenshots found"
        }

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit-selenium-results
        path: ${{ github.workspace }}/TestResults/TestResults.trx

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: selenium-screenshots
        path: ${{ github.workspace }}/TestResults/Screenshots

    - name: Publish Test Results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: NUnit and Selenium Tests
        path: TestResults/TestResults.trx
        reporter:  dotnet-trx
