name: Run NUnit and Selemium Tests

on:
  push:
    branches: [ Master, main ]
  pull_request:
    branches: [ Master, main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore NuGet Packages
      run: dotnet restore AutomatedScript.sln

    - name: Build Solution
      run: dotnet build AutomatedScript.sln --configuration Release

    - name: Run NUnit Tests
      run: dotnet test AutomatedScript.sln --configuration Release --logger "trx;LogFileName=TestResults.trx"

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit-results
        path: TestResults.trx
