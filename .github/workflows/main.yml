on:
  push:
    branches: [ Master, main ]
  pull_request:
    branches: [ Master, main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore NuGet Packages
      run: dotnet restore AutomatedScript.sln

    - name: Build Solution
      run: dotnet build AutomatedScript.sln --configuration Release

    - name: Install NUnit Console
      run: nuget install NUnit.ConsoleRunner -OutputDirectory packages

    - name: Run NUnit Tests
      run: ./packages/NUnit.ConsoleRunner.*/tools/nunit3-console.exe "bin/Release/net8.0/AutomatedScript.Tests.dll" --result=TestResults.xml

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit-results
        path: TestResults.xml
